# Levanta la aplicación completa:
#   docker compose up --build
# Frontend: http://localhost:8081  |  API (Swagger): http://localhost:8002/docs
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8081:8080"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
